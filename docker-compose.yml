version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sellanybus-postgres
    restart: always
    environment:
      POSTGRES_USER: sellanybus
      POSTGRES_PASSWORD: sellanybus_dev_secret
      POSTGRES_DB: sellanybus_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sellanybus -d sellanybus_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
